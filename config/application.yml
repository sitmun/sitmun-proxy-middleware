# Logging Configuration
logging:
  level:
    ROOT: INFO

# Sitmun Proxy Configuration
sitmun:
  backend:
    config:
      url: ${SITMUN_BACKEND_CONFIG_URL:http://localhost:8080/api/config/proxy}
      secret: ${SITMUN_BACKEND_CONFIG_SECRET}
  mbtiles:
    url: ${SITMUN_MBTILES_URL:http://localhost:8081/mbtiles}
    job-handle-secret: ${SITMUN_MBTILES_JOB_HANDLE_SECRET}
    job-handle-ttl: 24h
    max-json-bytes: 65536
    max-zoom-span: 12
    allowed-srs:
      - EPSG:4326
      - EPSG:3857
      - EPSG:25831
    connect-timeout: 10s
    read-timeout: 60s
  proxy:
    service-check:
      enabled: true
      debounce-count: 5
      debounce-window: 20s
      scan-max-bytes: 65536
      exception-text-max-length: 200
    usage:
      enabled: true
      flush-interval: 5m
      backlog: 24h

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: true
