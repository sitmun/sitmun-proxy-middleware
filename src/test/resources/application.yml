logging:
  level:
    ROOT: INFO
    org.sitmun.plugin.core: INFO

spring:
  profiles:
    active: test

# ===================================================================
# SITMUN specific properties
# ===================================================================

sitmun:
  backend:
    config:
      url: http://localhost:8080/api/config/proxy
      secret: test-only-insecure-middleware-secret
  ogc:
    capabilities:
      service-paths:
        - wms
        - wfs
        - wcs
        - ows
      extra-sources: []
