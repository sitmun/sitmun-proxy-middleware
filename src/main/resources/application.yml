# Logging Configuration (set org.sitmun or org.sitmun.proxy.middleware via env, e.g. Docker)
logging:
  level:
    ROOT: INFO

# Sitmun Proxy Configuration
sitmun:
  backend:
    config:
      url: ${SITMUN_BACKEND_CONFIG_URL:http://localhost:8080/api/config/proxy}
      secret: ${SITMUN_BACKEND_CONFIG_SECRET}
  mbtiles:
    # Base URL of the MBTiles service (middleware owns this; never taken from clients).
    url: ${SITMUN_MBTILES_URL:http://localhost:8081/mbtiles}
    # HMAC secret for opaque job handles. Rotating this key invalidates active jobs
    # unless multi-key verification is implemented.
    job-handle-secret: ${SITMUN_MBTILES_JOB_HANDLE_SECRET:change-me-mbtiles-job-handle-secret-32}
    job-handle-ttl: 24h
    max-json-bytes: 65536
    max-zoom-span: 12
    allowed-srs:
      - EPSG:4326
      - EPSG:3857
      - EPSG:25831
    connect-timeout: 10s
    read-timeout: 60s
  ogc:
    capabilities:
      service-paths:
        - wms
        - wfs
        - wcs
        - ows
      extra-sources: []

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: true
