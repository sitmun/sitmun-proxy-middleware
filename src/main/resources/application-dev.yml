# Development Profile Configuration
spring:
  # DevTools Configuration (only for development)
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true
      port: 35729

  # H2 Console (only for development)
  h2:
    console:
      enabled: true
      path: /h2-console

# Development-specific logging
logging:
  level:
    org.sitmun.proxy.middleware: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE